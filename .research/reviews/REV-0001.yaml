findings: 'I approve CLAIM-0001 as a bounded descriptive claim about the measured
  Direct-versus-Surrogate divergence on the frozen 994-tree CCAO paths. This approval
  does not establish the specific rank-one-curvature account for Direct: I treat EVI-0008
  as conservative contrary evidence that keeps that mechanistic explanation INDETERMINATE,
  not as a refutation of the measured divergence itself. I accept the provenance limitations
  disclosed for EXP-0001, including the dirty historical execution state, incomplete
  upstream artifact availability, and weaker provenance for the per-fold prediction
  files. I also accept that EXP-0002 establishes tier-R1 exact reproduction only for
  its sampled frozen configurations and does not establish complete-path tier-R1 reproduction.
  EVI-0010 makes the upstream EXP-0001 dependency of the matched-correction and attainability
  quantities explicit. This approval is limited to the Claim as written: it is not
  a ranking of the methods, does not select a penalty strength or operating point,
  does not establish temporal portability or deployment suitability, and does not
  assert that Direct is effectively gradient-only.'
verdict: approve
