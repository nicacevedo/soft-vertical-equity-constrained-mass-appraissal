notes: >-
  Preregistration content here is genuinely prespecified, unlike EXP-0001's. The plan file
  carries a sha256 and is frozen read-only; the E.4 thresholds and the TAU_MATCH tolerance
  were both set before any outcome was read. Only the mapping of those gate rules onto the
  R0 predictions / primary_metrics / decision_rule shape was done for this capsule. The
  tree was dirty at the baseline commit (untracked analysis/p0_major_revision_validation/),
  which is expected for an additive analysis directory and is not the F-DIRTY situation
  that affects EXP-0001. Frozen at tag p0-major-revision-final-20260907; the companion P1
  inferential stage is tagged p1-inferential-reporting-final-20260907.
