id: EXP-0001
type: experiment
schema_version: 1
status: completed
title: Frozen CCAO fixed-994-tree Direct and Surrogate regularization paths
purpose: >-
  Trace the complete regularization paths of the Direct squared-covariance penalty and its
  sample-additive Surrogate over the frozen 82-point rho grid, with the 994-tree LightGBM
  configuration held constant, across seven rolling-origin folds, a later held-out block
  and a separate 2025 forward sample, reporting predictive, valuation-level,
  horizontal-uniformity, vertical-equity, nonlinear-shape and residual-dependence
  diagnostics at every grid point. No penalty strength is selected under any outcome.
hypotheses:
  - HYP-0001
  - HYP-0002
  - HYP-0003
predictions:
  - hypothesis: HYP-0001
    predicted_outcome: >-
      [RECONSTRUCTED] Not prespecified. Reconstructed for this capsule from the current
      manuscript. Referenced to the custom-objective rho=0 origin, both families show an
      interior rho region in which the change in R2_price is non-negative while at least
      two of PRD, PRB, MKI and VEI move toward neutrality, on CV-mean, held-out and 2025.
    discriminates: true
  - hypothesis: HYP-0002
    predicted_outcome: >-
      [RECONSTRUCTED] Not prespecified. Reconstructed for this capsule. Direct and
      Surrogate coincide at rho=0 and diverge for rho>0, with the Surrogate attaining
      strictly more first-order correction than Direct at strong penalty on the same grid.
    discriminates: true
  - hypothesis: HYP-0003
    predicted_outcome: >-
      [RECONSTRUCTED] Not prespecified. Reconstructed for this capsule. Delta_NL and
      dCor_e_y attain interior minima at penalty scales different from the scale at which
      beta_log is closest to zero, and rise again beyond them.
    discriminates: true
primary_metrics:
  - beta_log
  - R2_price
  - MAE_price
  - RMSE_log
  - COD
  - PRD
  - PRB
  - MKI
  - VEI
  - Delta_NL
  - dCor_e_y
decision_rule: >-
  [RECONSTRUCTED] This decision rule was written for this capsule and did NOT exist when
  the runs executed. What IS historically documented is the no-selection policy and the
  fact that the penalty grid was frozen in advance of any diagnostic: report the complete
  path and select no rho, no penalty family and no operating point under any outcome.
  Reconstructed discriminating rule: support HYP-0001 if, referenced to Cell C, an interior
  rho region shows a non-negative change in R2_price with at least two vertical-equity
  diagnostics moving toward neutrality; reject it if R2_price declines monotonically from
  rho=0 for both families on every evaluation block. Support HYP-0002 if the two families'
  attainable beta_log ranges differ materially on the same grid; reject if they coincide.
  Support HYP-0003 if Delta_NL or dCor_e_y has an interior minimum away from the beta_log
  minimum; reject if both fall monotonically with beta_log toward neutrality.
