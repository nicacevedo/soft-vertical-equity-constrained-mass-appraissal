historical_positive_rho_path:
  scientifically_usable: true
  regenerate_82_point_path: false
  authorized_by_this_adjudication: false
bc_discrepancy:
  accepted_characterization: A deterministic LightGBM implementation-level feature-subsampling-path difference
    between the built-in-objective and custom-objective execution paths under the canonical colsample_bytree
    < 1 setting. The supplied rho=0 gradients and Hessians are correct, and the discrepancy is not evidence
    of an error in the covariance objective. However, the resulting prediction difference is material
    enough that native-vs-custom comparisons cannot be interpreted as isolating the effect of rho.
  conservative_characterization: deterministic built-in-vs-custom feature-subsampling execution-path divergence
  rng_mechanism_directly_identified_by_stage1_evidence: false
  key_scientific_point: A or B versus positive-rho custom models is not a pure penalty-effect contrast.
  forbidden_wording:
  - innocuous numerical effect
cells:
  A:
    id: A
    forward_display_name: Ordinary LightGBM (standard raw-label native)
    role: assessor-facing / workflow benchmark
    primary_penalty_reference: false
    visible_in_headline_tables: true
    attribution_rule: comparisons against A are descriptively valid, but changes relative to A must NOT
      be attributed solely to rho
  B:
    id: B
    forward_display_name: Centered-label native L2 (initialization-aligned)
    legacy_stage1_label: Parity-aligned native L2
    role: implementation-decomposition control only
    primary_penalty_reference: false
    may_be_primary_paper_baseline: false
    may_be_primary_centered_spread_comparator: false
    decomposes:
      A_to_B: label / initialization representation effects within native L2
      B_to_C: built-in-objective versus custom-objective execution-path effects
  C:
    id: C
    forward_display_name: Custom-objective rho=0 origin
    role: PRIMARY within-path penalty-isolating reference
    primary_penalty_reference: true
    clean_contrast: C(rho=0) -> Direct/Surrogate(rho>0)
    terminology:
      use:
      - within-path penalty-isolating reference
      - custom-objective rho=0 origin
      avoid:
      - causal
comparison_kinds:
  penalty_isolating:
    reference: C
    primary_for_rho_attribution: true
    may_attribute_to_rho: true
  assessor_facing_benchmark:
    reference: A
    wording: descriptive only
    may_attribute_to_rho: false
  implementation_decomposition:
    reference: B
    diagnostic_only: true
future_centered_spread_convention:
  primary:
    cell: C
    status: PRIMARY
    map: f_b(x) = ybar_T + b*(f_C(x) - ybar_T)
    question: At the same first-order correction, what does retraining buy relative to globally rescaling
      the same unregularized custom-path predictor?
  secondary:
    cell: A
    status: SECONDARY
    map: f_b(x) = ybar_T + b*(f_A(x) - ybar_T)
    question: Could a practitioner obtain a similar tradeoff simply by post-processing standard LightGBM?
  cell_B_full_path:
    scheduled_by_default: false
    condition_to_schedule: only if Gate G2 identifies a concrete unresolved scientific question that A
      and C cannot answer
    retained: 9 fits and b_star diagnostics for decomposition
  executed_in_stage_1_5: false
b_star_definition:
  definition: b_star_train = Var_T(y) / Cov_T(f0, y) when Cov_T(f0,y) > 0
  one_over_r2: theoretical diagnostic only; NOT the LightGBM b-star definition
