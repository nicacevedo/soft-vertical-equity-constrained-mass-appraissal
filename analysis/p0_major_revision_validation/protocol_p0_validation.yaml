track_separation:                     # plan A1 / F.0
  track_H:
    name: historical-setting
    settings: "frozen hyperparameters, LightGBM 4.6.0, n_jobs=1, OMP_NUM_THREADS=1; NO deterministic, NO force_row_wise, NO force_col_wise, NO num_threads added"
    certifies: "the frozen positive-rho path artifacts"
  track_P:
    name: pinned-determinism
    settings: "adds deterministic=True, force_row_wise=True, num_threads=1 to every cell, native and custom alike"
    certifies: "the implementation, prospectively"
    may_not: "certify historical artifacts; replace Track H evidence; set RG-1..RG-4; justify reuse of historical artifacts by itself"

parity_tiers_T:                        # A/B/C comparisons only
  T1: "max|dyhat| == 0"
  T2: "0 < max|dyhat| <= 1e-6 AND all reported metrics identical at displayed precision"
  T3: "1e-6 < max|dyhat| <= 1e-3 AND all metrics agree at displayed precision AND a named scientifically innocuous cause"
  T4: "anything larger, OR a T2/T3-sized discrepancy without an identified cause, OR any metric differing at displayed precision"
  note: "A<->B or A<->C at T4 is NOT a regeneration trigger. B<->C is the implementation-relevant comparison."

reproduction_tiers_R:                  # frozen-artifact reproduction only -- SEPARATE FIELD
  R1: "max|dyhat| == 0"
  R2: "max|dyhat| <= 1e-6 AND all reported metrics identical at displayed precision"
  R3: "1e-6 < max|dyhat| <= 1e-3 AND a named benign cause AND no displayed metric changes AND no scientific conclusion changes"
  R4: "anything larger OR any displayed metric changes OR any difference capable of altering scientific interpretation"
  note: "Only R4 contributes to the regeneration gate. R-tiers and T-tiers must never share a column or a verdict."

failure_taxonomy:                      # plan F.2b
  F-SRC: source drift
  F-DIRTY: unreconstructable dirty-state uncertainty
  F-ENV: environment nondeterminism
  F-NUM: numerical nondeterminism
  F-IMP: genuine implementation discrepancy
  rule: "'nondeterminism' may never be used as a catch-all. Every non-R1 reproduction result must carry a failure class before Gate G1."

regeneration_triggers:                 # plan F.6 -- NONE may be fired in Stage 1
  RG-1: "historical-setting B<->C materially non-parity without an innocuous numerical cause"
  RG-2: "defect in the custom objective AS IT STOOD AT THE PROVENANCE COMMIT (F-IMP, not F-SRC in later code)"
  RG-3: "frozen positive-rho artifacts fail historical reproduction at R4, after F.2b classification and (for F-SRC) provenance-worktree retest"
  RG-4: "explicit decision to make the pinned deterministic implementation canonical"
  explicitly_not_triggers:
    - "A<->B or A<->C non-parity at any tier including T4"
    - "a Track-P-only B<->C result"
    - "an R3/F-DIRTY classification"
  stage1_rule: "Stage 1 may initialize tables/regeneration_triggers.csv for schema/provenance only. It MUST NOT submit a regeneration job."

scientific_rules_binding:
  - "Direct is not called 'effectively gradient-only' until the real-data curvature audit supports it (E.4 verdict)."
  - "The fixed-lambda leaf-shrinkage analysis stays a STYLIZED diagnostic (diagnostic_type=stylized_nominal_leaf) unless actual trained-leaf Hessian sums are measured."
