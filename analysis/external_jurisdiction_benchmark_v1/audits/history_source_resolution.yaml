decision_rule_applied: >
  "If the broader folder is a coherent same-product historical superset, or
  otherwise the better valid canonical source, use the broader folder alone
  as that jurisdiction's canonical Assessor History source." Both Cook and
  Allegheny meet this exactly: same schema (279 cols, identical dtypes),
  same FIPS, zero (ATTOMID, ASSESSORHISTORYYEAR) duplicates in either source,
  100% of narrow keys present in broad, 100% feature agreement on every
  compared field (PROPERTYUSESTANDARDIZED, AREABUILDING, YEARBUILT,
  BEDROOMSCOUNT, BATHCOUNT) across all common keys, identical zero
  missingness on both sides. The broad folder is not a second vintage to
  merge -- it IS the narrow folder's data plus many additional years. No
  concatenation was needed or performed.

