  result: "all 9 jurisdictions complete in 2025; forward_year=2025; 7 expanding calendar-year CV folds (2018-2024)"
  rule_predeclared: >
    If 2025 is complete (12 months present, counts consistent with 2022-2024)
    for every primary jurisdiction: development/CV = 2016-2024, forward =
    calendar 2025, with seven expanding annual validation folds
    (fold t trains 2016..t-1, validates on t, t in 2018..2024). Otherwise the
