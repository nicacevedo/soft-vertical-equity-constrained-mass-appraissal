    distinct_from: >
      The training-block Vy_T used for rho_tilde. NMSE_S is an evaluation-time
      normalization on sample S; Vy_T is a training-time normalization on
      block T. Never conflated.
    implementation_location: analysis/external_jurisdiction_benchmark_v1/scripts/ (new code; canonical metrics module not edited)

