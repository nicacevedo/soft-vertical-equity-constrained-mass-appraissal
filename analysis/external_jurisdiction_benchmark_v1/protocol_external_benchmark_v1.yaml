    month coverage and sale counts, decided before looking at any model
    outcome. To be finalized in temporal_design.yaml (Step 3/A4).
  difference_from_ccao_design: >
    CCAO uses seven rolling-origin folds validating on the newest 10% of each
    cumulative window (paper_v12.tex Table tab:fold_structure). This benchmark
    uses calendar-year expanding folds instead, for cross-jurisdiction
    comparability. Stated as a deliberate design difference, never described
    as identical to the CCAO fold structure.

objective_and_rho_normalization:
  canonical_source: soft_constrained_models/boosting_models.py
  n_over_2_scaling_confirmed: true
  direct:
    objective: "MSE + (rho/2) * Cov(e,y)^2"
    gradient: "g_i = e_i + (rho/2) * z * c_i, z = mean(e*c)"
    hessian_diag: "h_i = 1 + rho/(2n) * c_i^2"
    canonical_kwargs: {ratio_mode: "diff", match_native_init: true}
  surrogate:
    objective: "MSE + rho * mean[e^2 * c^2]"
    gradient: "g_i = e_i * (1 + rho * c_i^2)"
    hessian_diag: "h_i = 1 + rho * c_i^2"
    canonical_kwargs: {ratio_mode: "diff", weighting_proxy_mode: "identity", match_native_init: true}
    warning: >
      Any OTHER combination of ratio_mode/weighting_proxy_mode/target_value
      falls through to the legacy exploratory objective (different gradient,
      gradient flooring at zero_grad_tol). Every fit in this benchmark MUST
      pass exactly these kwargs; audits/objective_scaling_audit.py enforces
      this via the canonical function calls themselves, not by convention.
  rho_tilde_definition: >
    Vy_T = population variance (ddof=0) of log sale price on training block T.
    rho_tilde = rho * Vy_T for BOTH families (same mapping, no residual
    factor) -- derived directly from the objective algebra:
      Direct:    L/Vy = NMSE + (rho_tilde/2) * beta_train^2,
                 beta = Cov(e,y)/Var(y)
      Surrogate: L/Vy = NMSE + rho_tilde * mean[(e/sigma_y)^2 * (c/sigma_y)^2]
  explicitly_distinct_from_plan_rho_grid: >
    scripts/other_counties_benchmars.py::plan_rho_grid normalizes by
    A = Var(baseline predictions f0), NOT Var(y). rho_tilde in this protocol
    is NEVER derived from that A. plan_rho_grid is used only to source the
    two CCAO reference raw-rho endpoint pairs below, which are then converted
    to rho_tilde via the CCAO training block's own Vy.
  ccao_reference_raw_rho:
    direct: {activity: 0.355648, guardrail: 2.559548}
    surrogate: {activity: 0.202359, guardrail: 2.222996}
    source: paper_v12.tex subsec:candidate_screen_appendix
    usage: >
      Used only to set the initial normalized grid span (two log-decades
      below the normalized activity scale to two above the normalized
      guardrail scale). Never used to select a jurisdiction or a deployment
      rho.
  parity_gate_result:
    status: PASSED
    method: >
      Reused the already-validated canonical configuration from
      tests/test_paper_v6_guards.py::test_native_custom_rho0_parity_after_mean_init
      (synthetic-data test, passing) and re-ran it on REAL feature matrices
      from all three pilot counties (Wayne, Philadelphia, Cook).
    native_vs_direct_mean_abs_diff_log_space:
      wayne: 1.7214109184315874e-08
      philadelphia: 1.312524303997975e-08
      cook: 1.822828846087532e-08
    rho_tilde_equivalence: "exact (bit-identical predictions) at every tested point"
    artifacts:
      - analysis/external_jurisdiction_benchmark_v1/audits/objective_scaling_audit.md
      - analysis/external_jurisdiction_benchmark_v1/audits/rho_normalization_equivalence.csv
      - analysis/external_jurisdiction_benchmark_v1/audits/zero_rho_parity.csv
      - analysis/external_jurisdiction_benchmark_v1/audits/objective_scaling_audit_verdict.json
    interpretation: >
      Prior frozen manuscript audit (paper_v12.tex tab:rho_zero_control) shows
      a mean |delta y_hat| gap of 3.24e-02 because that path omitted
      match_native_init=True. Setting it (as done here and required for every
      fit in this benchmark) reduces the gap to ~1.5e-08 across all three
      pilot counties -- essentially exact. Gate PASSED; no BLOCKER.md written.

metrics:
