# --- Correction history (kept for audit trail; do not delete) ---
correction_history:
  - at_utc: "2026-09-03T21:00:00Z"
    issue: >
      Original transcription had 385=Seasonal/Cabin Residence and
      386=Single Family Residence. An empirical jurisdiction x code
      frequency check (cohort/UNCLASSIFIED_CODES_REPORT.md) found this
      inconsistent: 385 was 54.7% of all History rows and dominant even in
      Cook/Maricopa/Miami-Dade (not a plausible seasonal/vacation pattern),
      while 386 was 2.05% and absent in Wayne and Middlesex (not a plausible
      pattern for the primary single-family code). Flagged and reported
      per the "stop if semantically inconsistent" instruction; NOT resolved
      by swapping labels based on volume -- the user re-checked the
      published source table instead.
  - at_utc: "2026-09-03T21:35:00Z"
    resolution: >
      User re-checked the published ATTOM PropertyType reference and
      corrected the transcription: 384 = Seasonal/Cabin/Vacation Residence,
      385 = Single Family Residence, 386 = Townhouse, 366 = Condominium.
      This resolves the empirical anomaly exactly: 385's universal dominance
      is now consistent with it being the general Single Family Residence
      code, and 366's concentration in Philadelphia is now understood as a
      genuine jurisdictional housing-composition difference (Philadelphia has
      a large condominium share), not a mapping defect. The correction was
      made from the source document, not from the frequency table --
      frequencies corroborate but did not drive the correction.

