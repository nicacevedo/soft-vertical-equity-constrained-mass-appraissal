numerical_validity_rules:
  training_support_bound: 'A Direct path point is invalid where predicted log price
    leaves the training label range extended by one full range width on each side:
    pred_log must lie in [y_min-(y_max-y_min), y_max+(y_max-y_min)]. Defined only
    from the training support -- never from R2/PRD/PRB/MKI/VEI/beta -- so it cannot
    select on the outcome of interest. Approved 2026-09-04; applied uniformly to all
    jurisdictions. Recorded as fit_status=DIVERGED_OUTSIDE_TRAINING_SUPPORT.'
  screening_metric_finiteness: A path point is invalid if any boundary-driving metric
    (PRD, PRB, MKI, VEI, Beta_log, R2_price, MAE_price, MAPE, RMSE_log) is non-finite.
    Recorded as fit_status=NUMERICALLY_UNSTABLE_RHO.
  surrogate_family_exposure: 'The Surrogate family is structurally not exposed to
    these failure modes: first_branch_calibrate terminates the branch (GRID_CEILING/MATERIAL_REVERSAL)
    before the divergent tail. Verified: min R2_price across all 9 jurisdictions is
    +0.02, max MAE_price 3.33e5, max MAPE 0.39 -- no divergence signature.'
