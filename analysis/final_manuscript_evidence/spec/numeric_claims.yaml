# =============================================================================
# AUTHORED source of truth for manuscript_numeric_map.csv.
#
# This file says WHICH manuscript cell, WHICH frozen artifact, WHICH selector,
# which units, which transform, which rounding, which reference cell and which
# comparison purpose. It contains NO result values: every raw_value and
# display_value in the map is DERIVED by code/b0_2_build_numeric_map.py from the
# artifact named here.
#
# Two-stage value pipeline, never conflated:
#     raw_value -> value_transform -> rounding_rule -> display_value
# The frozen artifacts genuinely mix units -- MAPE is a fraction (0.2120...)
# shown as 21.2%, while VEI, COD and COV are ALREADY in percent -- so MAPE
# carries value_transform: times_100 and VEI carries identity. No rounding rule
# ever performs a unit conversion. Units are declared once per metric in
# metric_defs so a copy-paste slip cannot give MAPE the units of VEI.
#
# A and C are TWO FROZEN ROLES, not a substitution
# (analysis/p0_major_revision_validation/configs/post_g1_reference_convention.yaml):
#   A -- "assessor-facing / workflow benchmark", primary_penalty_reference: false.
#        Its frozen attribution_rule: comparisons against A are descriptively
#        valid, but changes relative to A must NOT be attributed solely to rho.
#        -> comparison_purpose: WORKFLOW_BENCHMARK
#   C -- "PRIMARY within-path penalty-isolating reference",
#        primary_penalty_reference: true, clean_contrast
#        C(rho=0) -> Direct/Surrogate(rho>0).
#        -> comparison_purpose: PENALTY_ISOLATING
#
# DELIBERATE ABSENCES. Where the manuscript prints a number no frozen artifact
# resolves, no entry is authored. Those tokens surface as FLAGGED_UNSUPPORTED in
# coverage/active_tex_numeric_tokens.csv and must carry DELETE_OR_REPLACE or
# REWRITE_WITH_SUPPORTED_EVIDENCE in the claim map. Relabelling an unsupported
# number "exploratory" does not make it publishable. Expected absences:
#   * every Linear-regression column (note R2_P = 0.799 is printed for Linear in
#     BOTH panels of tab:ccao_baseline_results);
#   * R2/MAE/MAPE/RMSE_log/PRD/MKI and the complementary metrics at the three
#     legacy anchors rho in {0.0104811, 0.1, 10.4811} -- PRB and VEI at those
#     same anchors DO resolve, from P1;
#   * Delta_NL and dCor at every positive-rho anchor;
#   * the whole transition / regret / candidate-region family.
# =============================================================================
schema_version: 1

# ---------------------------------------------------------------------------
# Units, transform and rounding, declared once per metric.
# ---------------------------------------------------------------------------
metric_defs:
  R2P:         {tex_col: "$R^2_P$", raw_unit: ratio, display_unit: ratio, rounding_rule: "half_up:3"}
  MAEP:        {tex_col: "MAE", raw_unit: usd, display_unit: usd, rounding_rule: "usd_comma:0"}
  MAPEP:       {tex_col: "MAPE", raw_unit: fraction, display_unit: percent, value_transform: times_100, rounding_rule: "half_up:1"}
  RMSElogP:    {tex_col: "$\\operatorname{RMSE}_{\\log P}$", raw_unit: log_points, display_unit: log_points, rounding_rule: "half_up:3"}
  PRD:         {tex_col: "PRD", raw_unit: ratio, display_unit: ratio, rounding_rule: "half_up:3", guidance_status: IAAO_2013_ADOPTED}
  PRB:         {tex_col: "PRB", raw_unit: coefficient, display_unit: coefficient, rounding_rule: "half_up:3", guidance_status: IAAO_2013_ADOPTED}
  MKI:         {tex_col: "MKI", raw_unit: index, display_unit: index, rounding_rule: "half_up:3", guidance_status: IAAO_2026_ED2_PROPOSED}
  VEI:         {tex_col: "VEI", raw_unit: percent, display_unit: percent, rounding_rule: "half_up:1", guidance_status: IAAO_2026_ED2_PROPOSED}
  medianratio: {tex_col: "Median $r$", raw_unit: ratio, display_unit: ratio, rounding_rule: "half_up:3", guidance_status: IAAO_2013_ADOPTED}
  meanratio:   {tex_col: "Mean $r$", raw_unit: ratio, display_unit: ratio, rounding_rule: "half_up:3", guidance_status: IAAO_2013_ADOPTED}
  wmeanratio:  {tex_col: "W. mean $r$", raw_unit: ratio, display_unit: ratio, rounding_rule: "half_up:3", guidance_status: IAAO_2013_ADOPTED}
  COD:         {tex_col: "COD", raw_unit: percent, display_unit: percent, rounding_rule: "half_up:1", guidance_status: IAAO_2013_ADOPTED}
  COV:         {tex_col: "COV", raw_unit: percent, display_unit: percent, rounding_rule: "half_up:1", guidance_status: IAAO_2013_ADOPTED}
  betalog:     {tex_col: "$\\beta_{\\log}$", raw_unit: coefficient, display_unit: coefficient, rounding_rule: "half_up:3"}
  DeltaNL:     {tex_col: "$\\Delta_{\\mathrm{NL}}$", raw_unit: dimensionless, display_unit: dimensionless, rounding_rule: "half_up:3"}
  dCor:        {tex_col: "$\\operatorname{dCor}(e,y)$", raw_unit: dimensionless, display_unit: dimensionless, rounding_rule: "half_up:3"}
  meandelta:   {tex_col: "Mean $|\\Delta\\widehat y|$", raw_unit: log_points, display_unit: log_points, rounding_rule: "sci:3"}
  maxdelta:    {tex_col: "Max $|\\Delta\\widehat y|$", raw_unit: log_points, display_unit: log_points, rounding_rule: "sci:3"}

metric_sets:
  primary:            [R2P, MAEP, MAPEP, RMSElogP, PRD, PRB, MKI, VEI]
  primary_frozen:     [R2P, MAEP, MAPEP, RMSElogP, PRD, MKI]
  complementary:      [medianratio, meanratio, wmeanratio, COD, COV, betalog, DeltaNL, dCor]
  complementary_frozen: [medianratio, meanratio, wmeanratio, COD, COV, betalog]
  zero_control:       [R2P, RMSElogP, betalog]
  deltas:             [meandelta, maxdelta]

column_maps:
  # zero_control_full.csv -- cells A / B / C by evaluation
  zero_control:
    R2P: R2_price
    MAEP: MAE_price
    MAPEP: MAPE
    RMSElogP: RMSE_log
    PRD: PRD
    PRB: PRB
    MKI: MKI
    VEI: VEI
    medianratio: median_ratio
    meanratio: mean_ratio
    wmeanratio: weighted_mean_ratio
    COD: COD
    COV: COV
    betalog: beta_log
    DeltaNL: Delta_NL
    dCor: dCor_e_y
  # frozen_artifact_reproduction.csv -- the CACHED metrics of the frozen fits
  # (cached_* and refit_* agree at displayed precision; tier R1)
  frozen_repro:
    R2P: cached_R2_price
    MAEP: cached_MAE_price
    MAPEP: cached_MAPE
    RMSElogP: cached_RMSE_log
    PRD: cached_PRD
    PRB: cached_PRB
    MKI: cached_MKI
    VEI: cached_VEI
    medianratio: "cached_Median ratio"
    meanratio: "cached_Mean ratio"
    wmeanratio: "cached_W. Mean ratio"
    COD: cached_COD
    COV: cached_COV_IAAO
    betalog: cached_Beta_log
  # P1 frozen display values -- the exact numbers the manuscript prints, each
  # reconciled against its canonical function (234 values each).
  prb_frozen:
    PRB: frozen_PRB_value
  vei_frozen:
    VEI: frozen_VEI_value
  # zero_reference_reproduction_qc.csv -- A<->C prediction-difference magnitudes
  delta_qc:
    meandelta: mean_abs_delta_log
    maxdelta: max_abs_delta_log

blocks:

# -----------------------------------------------------------------------------
# 1. tab:ccao_baseline_results -- Ordinary LightGBM (Cell A). All eight metrics.
#    Each source line carries all four columns, so the line varies by METRIC.
# -----------------------------------------------------------------------------
- block_id: B-baseline-primary-A
  domain: baseline
  latex_label: tab:ccao_baseline_results
  artifact: analysis/p0_major_revision_validation/tables/zero_control_full.csv
  artifact_kind: csv
  selector_template: "cell_id=A;evaluation={evaluation}"
  metric_set: primary
  column_map: zero_control
  claim_id_template: "N-baseline-{metric}-{evaluation}"
  table_row: "Ordinary LightGBM"
  reference_cell: A
  comparison_purpose: WORKFLOW_BENCHMARK
  primary_or_sensitivity: DESCRIPTIVE
  evidence_note: >-
    Cell A, the assessor-facing workflow benchmark. Descriptive baseline levels;
    not a penalty effect.
  axes:
    evaluation: [heldout, forward_2025]
  lines_by_metric:
    R2P: 1260
    MAEP: 1261
    MAPEP: 1262
    RMSElogP: 1263
    PRD: 1267
    PRB: 1268
    MKI: 1269
    VEI: 1270

