  kind: table
  render_bucket: ACTIVE
  disposition: KEEP
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    States the novelty boundary and the roles of the contribution. This is
    load-bearing and must survive intact.
  frozen_evidence: []
  writing_pass: >-
    Keep all five non-novelty statements and all eight defensible
    contributions. Wording may be borrowed from Option 2; no number, threshold
    or conclusion may be.

- label: tab:rho_zero_control
  kind: table
  render_bucket: ACTIVE
  disposition: KEEP
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    Every cell resolves: cells A and C from zero_control_full.csv, and the A<->C
    prediction-difference magnitudes from
    zero_reference_reproduction_qc.csv (tier AGGREGATE_CROSSCHECK). This is the
    table that establishes why A-to-penalized contrasts cannot isolate rho.
  frozen_evidence:
  - analysis/p0_major_revision_validation/tables/zero_control_full.csv
  - analysis/p0_major_revision_validation/tables/zero_reference_reproduction_qc.csv
  writing_pass: >-
    Keep the table. Replace the two todo notes beneath it: the parity rerun was
    done and resolves in the NEGATIVE (A<->B agrees to about 7.7e-09, B<->C does
    not and pinning does not fix it), and the normalization audit is closed by
    objective_scaling_audit.csv. Use the accepted conservative characterization,
    never "innocuous numerical effect".

- label: tab:ccao_baseline_complementary
  kind: table
  render_bucket: ACTIVE
  disposition: UPDATE
  numbers_fully_supported: PARTIALLY_SUPPORTED
  why: >-
    The LightGBM half resolves for all eight complementary metrics, including
    Delta_NL and dCor, from zero_control_full.csv. The Linear half resolves from
    nothing.
  frozen_evidence:
  - analysis/p0_major_revision_validation/tables/zero_control_full.csv
  writing_pass: >-
    Re-source the LightGBM columns. Re-derive or delete the Linear columns.
    State that baseline COD lies outside the adopted [5,15] range.

- label: tab:path_anchor_complementary
  kind: table
  render_bucket: ACTIVE
  disposition: REBUILD
  numbers_fully_supported: PARTIALLY_SUPPORTED
  why: >-
    Same three-way split as the primary path table, and worse: the frozen
    reproduction table carries no Delta_NL and no dCor column at all, so those
    two columns are unsupported at EVERY positive-rho anchor, not just the
    legacy three.
  frozen_evidence:
  - analysis/p0_major_revision_validation/tables/zero_control_full.csv
  - analysis/p0_major_revision_validation/tables/frozen_artifact_reproduction.csv
  writing_pass: >-
    Rebuild. Keep the six complementary metrics at the two frozen anchors and
    the baseline rows. Drop or re-derive the Delta_NL and dCor columns for every
    positive rho. Apply the same two-role highlighting convention.

- label: tab:transition_summary
  kind: table
  render_bucket: ACTIVE
  disposition: DELETE
  numbers_fully_supported: UNSUPPORTED
  why: >-
    No event location, span, log10 width, LOFO endpoint or concordance ratio
    resolves from the frozen evidence. P0's screening-grid proxies are
    explicitly not a reproduction of the published smoothed changepoint
    estimator.
  frozen_evidence: []
  writing_pass: >-
    Delete, or rebuild from a frozen artifact. The qualitative point -- that
    reproducible within-CV transition structure is distinct from temporal
    portability -- may survive without these numbers.

- label: tab:transition_regret
  kind: table
  render_bucket: ACTIVE
  disposition: DELETE
  numbers_fully_supported: UNSUPPORTED
  why: >-
    The largest single concentration of unsupported numbers in the manuscript.
    No frozen artifact carries the span-regret quantities.
  frozen_evidence: []
  writing_pass: >-
    Delete, or rebuild from a frozen artifact. If the qualitative point survives
    -- event-location disagreement and value-based loss are distinct aspects of
    temporal portability -- state it without these numbers.

- label: tab:fold_structure
  kind: table
  render_bucket: ACTIVE
  disposition: KEEP
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    Every n_train resolves from objective_scaling_audit.csv and every n_val from
    zero_control_full.csv. The window end dates are not in the frozen evidence
    and are allowlisted as design constants.
  frozen_evidence:
  - analysis/p0_major_revision_validation/tables/objective_scaling_audit.csv
  - analysis/p0_major_revision_validation/tables/zero_control_full.csv
  - analysis/p0_major_revision_validation/tables/cv_fold_validation_overlap_summary.json
  writing_pass: >-
    Keep, and add the frozen finding that the fold-6 and fold-7 validation
    blocks overlap, so the pooled out-of-fold coordinate double-counts those
    rows. Each prediction is still genuinely out of fold and the equal-weight
    CV-mean coordinate is unaffected.

