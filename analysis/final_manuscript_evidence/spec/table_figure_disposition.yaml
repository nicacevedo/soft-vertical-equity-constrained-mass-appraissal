# =============================================================================
# Disposition of EVERY table and figure in paper_v17_option1.tex.
#
# This vocabulary is deliberately SEPARATE from the claim disposition vocabulary
# in claims.yaml: a float is a display object, and "rebuild this table" is not
# the same decision as "rewrite this claim".
#
#   KEEP               correct and supported; leave it alone
#   UPDATE             keep the object, fix specific cells, labels or notes
#   REBUILD            regenerate from frozen evidence; the current object mixes
#                      supported and unsupported cells
#   DEMOTE_TO_APPENDIX keep, but not in the main text
#   DELETE             remove; the content is unsupported or not compiled
#
# numbers_fully_supported: FULLY_SUPPORTED / PARTIALLY_SUPPORTED / UNSUPPORTED /
# NOT_RENDERED. It is CHECKED, not asserted: code/b0_5_build_tf_disposition.py
# recomputes each float's SOURCED / ALLOWLISTED / FLAGGED_UNSUPPORTED token
# tallies from coverage/active_tex_numeric_tokens.csv and fails if a declared
# support level contradicts them.
#
# Every label here must exist in the tex with the declared render bucket, and
# every float in the tex must appear here. A float that has no entry fails the
# build, so this inventory cannot silently fall behind the manuscript.
# =============================================================================
schema_version: 1

floats:

# --------------------------------------------------------------- main tables
- label: tab:assessment_metrics_summary
  kind: table
  render_bucket: ACTIVE
  disposition: UPDATE
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    Definitions and reference ranges, not results. The ranges themselves are
    correct, but the table does not consistently separate ADOPTED 2013 guidance
    (PRD, PRB, COD) from EXPOSURE-DRAFT diagnostic bands (MKI, VEI).
  frozen_evidence:
  - analysis/p1_inferential_reporting/tables/vei_significance.csv
  - analysis/p1_inferential_reporting/provenance/ed2_source_manifest.json
  writing_pass: >-
    Add a guidance-status column, or mark each row, so that IAAO 2013 ADOPTED
    and May-2026 EXPOSURE DRAFT are visibly distinct. Note the source
    discrepancy: the cached URL filename says Exposure-Mar2026 while the printed
    title is "Exposure Draft May 2026".

- label: tab:ccao_baseline_results
  kind: table
  render_bucket: ACTIVE
  disposition: UPDATE
  numbers_fully_supported: PARTIALLY_SUPPORTED
  why: >-
    The Ordinary LightGBM (Cell A) half resolves exactly -- all eight metrics on
    both evaluations, from zero_control_full.csv. The Linear-regression half
    resolves from nothing, and prints R^2_P = 0.799 in BOTH panels.
  frozen_evidence:
  - analysis/p0_major_revision_validation/tables/zero_control_full.csv
  writing_pass: >-
    Re-source the LightGBM columns from cell A. Re-derive the Linear columns
    from a frozen artifact or delete them. Label the comparison as an
    assessor-facing workflow-benchmark comparison, not a penalty effect.

- label: tab:ccao_samples
  kind: table
  render_bucket: ACTIVE
  disposition: KEEP
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    All four sample counts resolve from PREFLIGHT.json's
    canonical_sample_counts_expected. The boundary DATES are not recorded in the
    frozen evidence and are allowlisted as design constants.
  frozen_evidence:
  - analysis/p0_major_revision_validation/provenance/PREFLIGHT.json
  writing_pass: Keep. Cite PREFLIGHT.json for the counts.

- label: tab:feature_groups
  kind: table
  render_bucket: ACTIVE
  disposition: KEEP
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    A description of the fixed upstream feature design, not a result. Recorded
    honestly: none of the group sizes, the 95 total or the 23 categorical count
    appears in the frozen P0/P1 evidence, so they are allowlisted as design
    constants with frozen_source NOT_RECORDED_IN_FROZEN_EVIDENCE.
  frozen_evidence: []
  writing_pass: >-
    Keep. Do not imply the counts were validated by P0 or P1; they describe the
    upstream CCAO pipeline.

- label: tab:ccao_design
  kind: table
  render_bucket: ACTIVE
  disposition: KEEP
  numbers_fully_supported: FULLY_SUPPORTED
  why: >-
    A design summary. Its counts and the 994-tree capacity resolve from
    PREFLIGHT.json, and the 82-positive-value grid from robustness_rho_grid.json
    and e4_verdict.json.
  frozen_evidence:
  - analysis/p0_major_revision_validation/provenance/PREFLIGHT.json
  - analysis/p0_major_revision_validation/configs/robustness_rho_grid.json
  writing_pass: >-
    Keep, and keep the two-stage grid history explicit: 50 original points plus
    a 32-point lower-tail extension, not 82 prespecified points.

- label: tab:path_anchor_summary
  kind: table
  render_bucket: ACTIVE
  disposition: REBUILD
  numbers_fully_supported: PARTIALLY_SUPPORTED
  why: >-
    The single most important table in the paper, and it mixes three kinds of
    cell. Supported: the Ordinary LightGBM rows; Direct and Surrogate at the two
    frozen anchors (rho ~ 1 tested 0.954095, and rho = 100), reproduction tier
    R1; and PRB and VEI at ALL FIVE anchors from P1. Unsupported: every
    Linear-regression cell, and R^2_P / MAE / MAPE / RMSE_log / PRD / MKI at the
    three legacy anchors. Separately, the highlighting bolds and stars every
    penalized row against Cell A, which the paper's own caveat says is a
    confounded contrast.
  frozen_evidence:
  - analysis/p0_major_revision_validation/tables/zero_control_full.csv
  - analysis/p0_major_revision_validation/tables/frozen_artifact_reproduction.csv
  - analysis/p1_inferential_reporting/tables/prb_inference.csv
  - analysis/p1_inferential_reporting/tables/vei_significance.csv
  writing_pass: >-
    Rebuild from the frozen artifacts. Keep PRB and VEI at all five anchors.
    Either re-derive the six accuracy metrics at the three legacy anchors or
    restrict those columns to the two frozen anchors. Adopt the two-role
    highlighting convention: one device for the workflow-benchmark comparison
    against Ordinary LightGBM, a visibly different device for the
    penalty-isolating comparison against the custom-objective rho=0 origin, and
    say which is which in the notes.

- label: tab:rho_candidate_regions
  kind: table
  render_bucket: ACTIVE
  disposition: DELETE
  numbers_fully_supported: UNSUPPORTED
  why: >-
    Not one cell resolves. P0 holds screening-grid proxies that are explicitly
    NOT a reproduction of the published 82-point smoothed changepoint estimator.
    The rho values appear in the frozen grid maps as GRID COORDINATES, but the
    screen RESULT -- that these are the activity onset and upper guardrail -- is
    reproduced nowhere, and neither are the 7/7 LOFO counts or the guardrail
    indices 53-56 and 53-55.
  frozen_evidence: []
  writing_pass: >-
    Delete the table. A qualitative sentence about exploratory candidate-region
    screening may survive in prose, with no numbers. Relabelling the table
    "exploratory" is not sufficient.

