# =============================================================================
# AUTHORED source of truth for manuscript_claim_map.csv.
#
# One entry per scientific statement the manuscript makes or must make. Values
# are never written here: numeric_claim_ids point into
# manuscript_numeric_map.csv, whose numbers are derived from frozen artifacts.
#
# disposition (closed vocabulary):
#   KEEP                            correct and supported; do not touch
#   REWRITE_WITH_SUPPORTED_EVIDENCE the statement must be rebuilt on frozen evidence
#   QUALIFY_AS_EXPLORATORY          LEGAL ONLY when the exact underlying frozen
#                                   number is source-resolvable
#   DELETE_OR_REPLACE               the number/table is not resolvable at all
#   ADD                             frozen evidence the manuscript does not yet state
#
# The QUALIFY_AS_EXPLORATORY gate is enforced in code, not by discipline: a
# claim carrying it must name numeric_claim_ids that all resolve with an
# attained status. An unsupported numerical result is not publishable merely
# because it is relabelled "exploratory".
#
# reference_cell / comparison_purpose encode the two FROZEN roles.
# A = assessor-facing workflow benchmark (WORKFLOW_BENCHMARK, descriptive only);
# C = primary within-path penalty-isolating reference (PENALTY_ISOLATING).
# Neither may be substituted for the other, and A may never carry
# PENALTY_ISOLATING.
# =============================================================================
