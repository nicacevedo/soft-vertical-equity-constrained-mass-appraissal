# ---------------------------------------------------------------------------
# 1. Scientific objective
# ---------------------------------------------------------------------------
scientific_objective:
  primary_application: Cook County Assessor's Office (CCAO) residential valuation workflow
  this_audit: >
    Strengthen the paper's external analysis using public/local-government
    replication resources from Christopher Berry and the University of Chicago
    Center for Municipal Finance (CMF) Property Tax Fairness project.
  existing_attom_role: >
    The current six-county ATTOM benchmark remains an exploratory sensitivity
    layer for transferability, heterogeneity, and failure modes. It is not
    confirmatory jurisdiction-specific evidence. It must not be overwritten.
  estimand_rule: >
    Berry assessment-to-sale ratios and our model valuation-to-sale ratios are
    related but not identical estimands. Berry/local assessment data are used
    to reproduce documented assessment regressivity and validate provenance.
    The proposed method must still be evaluated using a predictive AVM trained
    to predict sale price / market value from property information. Official
    assessed value is not interchangeable with model prediction. The method
    must not be trained merely to reproduce existing assessments.
  source_hierarchy:
    - rank: 1
      source: Berry/CMF local-government data
      role: independent evidence/provenance for documented assessment regressivity
    - rank: 2
      source: original local-government parcel/assessor data
      role: preferred AVM predictors when sufficiently rich and temporally valid
    - rank: 3
      source: ATTOM
      role: controlled enrichment for missing predictors; do not replace authoritative local sale/assessment outcomes
    - rank: 4
      source: Cook County CCAO
      role: source-validation anchor comparing CCAO, Berry/local-government, and ATTOM constructions

