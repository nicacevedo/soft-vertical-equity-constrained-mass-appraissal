      Canonical CCAO modeling sample remains the paper's primary AVM
      application. This audit did not modify that experiment.

  cook_il_cmf_res_sales:
    geographic_unit: "Cook County, IL (Berry/CMF BOR res_sales 2002-2015)"
    decision: EXCLUDE
    recommended_role: pre2016_assessment_regressivity_provenance_only
    reason: >
      Disjoint years versus CCAO 2016-2025. Useful to document official
      assessment/sale ratios before the modeling window. Not an AVM sample
      and not interchangeable with model valuation ratios.

  st_louis_county_mo:
    geographic_unit: "St. Louis County, MO"
    decision: INCLUDE_BOUNDARY_CASE
    recommended_role: sole_cmf_standalone_avm_candidate_with_timing_limitations
    reason: >
      Only primary CMF jurisdiction classified B_STANDALONE_AVM_READY.
      Yearly dwelling snapshots join to SALEVAL==X sales. Baseline LGBM is
      a credible prediction problem (held-out R2_price 0.834) but sale day
      is missing from joined.csv, the 2012 dwelling folder is TAXYR=2013,
      and the published CMF make_report path uses APRTOT as SALE_PRICE.
      Include as a boundary/construction case, not as confirmatory
      multi-jurisdiction evidence.

  detroit_mi:
    geographic_unit: "Detroit, MI"
    decision: EXCLUDE
    recommended_role: external_assessment_regressivity_benchmark
    reason: >
      Best Berry reproduction (EXACT_OR_ROUNDING_MATCH) but insufficient
      leakage-safe AVM predictors. Characteristics are TIMING_UNRESOLVED.

  philadelphia_pa:
    geographic_unit: "Philadelphia County, PA"
