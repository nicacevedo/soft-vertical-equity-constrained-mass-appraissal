metadata:
  description: "Reusable unpenalized LightGBM baseline configurations selected from saved output artifacts."
  created_from:
    cv_best_source: "output/robust_rolling_origin_cv/analysis/data_id=dd91c93c6f525e6a/split_id=eeabb0637554fe28/selected/selected_models_evaluation.csv"
    test_best_source: "output/robust_rolling_origin_cv_2025/analysis/data_id=d2b6dd81ad6ca613/split_id=a72eb9f19bef3733/selected/selected_models_evaluation.csv"
    cv_top_source: "output/robust_rolling_origin_cv_2025/runs/data_id=d2b6dd81ad6ca613/split_id=a72eb9f19bef3733 (per-fold run parquets aggregated over 8 folds)"
  note: "test_best_r2 / cv_best_r2 share lgbm_base_config_id 7ce5a0a0e6e4f38b. cv_top1_r2 and cv_top2_r2 are the two distinct LGBMRegressor configurations that achieved the lowest mean CV RMSE in the 2025 rolling-origin run; their full params were recovered from the per-fold run artifacts. The three test_best/cv_top configs are distinct hyperparameter sets and are used as parallel baseline models in the rho-sweep experiments."

