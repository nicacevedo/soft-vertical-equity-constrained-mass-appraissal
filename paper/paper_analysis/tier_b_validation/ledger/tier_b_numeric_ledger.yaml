# B1.4 -- Design: the extract identification and the development coordinates.
#
# The CCAO extract is hash-pinned but not redistributed, and no build or
# retrieval date was recorded when it was taken. That gap is explicitly
# NON-BLOCKING: nothing is invented to fill it, and the paper states the
# limitation instead. What CAN be pinned is pinned here, including the printed
# sha256 itself, so the hex string in the manuscript is checked against the
# frozen provenance rather than trusted.
# --------------------------------------------------------------------------

