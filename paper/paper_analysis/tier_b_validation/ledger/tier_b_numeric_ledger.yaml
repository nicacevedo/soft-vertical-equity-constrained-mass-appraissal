  # ---------------------------------------------------------------------------
  # B2.4 -- the centered-spread comparator and the matched first-order comparison.
  #
  # Generated by resolving each frozen cell through the SAME pipeline C01 uses to
  # re-derive it, so the printed table and this ledger cannot disagree by
  # construction. Anchors: subsec:posthoc_comparator and
  # subsec:matched_beta_results (the two new Results subsections),
  # tab:posthoc_crossover and tab:matched_beta_headline (main text), and
  # tab:centered_spread, tab:matched_beta and tab:matched_beta_ext (Appendix F).
  #
  # Two conventions carried on every entry here:
  #   * reference_cell C with comparison_purpose PENALTY_ISOLATING for the
  #     primary post-hoc family and the two penalized families, because the
  #     custom-objective rho=0 origin is the common origin of both paths;
  #     reference_cell A with WORKFLOW_BENCHMARK and DESCRIPTIVE for the
  #     secondary practical variant, which determines nothing.
  #   * the NOT_ATTAINED rows carry attained_status NOT_ATTAINED on their
  #     max-achieved-correction entry and NO metric entries at all, which is what
  #     makes the blank outcome columns provable rather than merely intended.
