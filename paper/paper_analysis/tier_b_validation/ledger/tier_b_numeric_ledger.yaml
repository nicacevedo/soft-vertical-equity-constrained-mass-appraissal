# --------------------------------------------------------------------------
# B2.1 -- the split and rebuilt path tables.
#
# tab:path_anchor_summary became tab:path_anchor_frozen (prediction plus PRD and
# MKI at the two anchors the frozen reproduction audit re-derives) and
# tab:path_anchor_standards (PRB and VEI at all five anchors, with the adopted
# 2013 Standard and the May-2026 Exposure Draft attributed separately).
# tab:path_anchor_complementary was rebuilt on the same two frozen anchors.
#
# Why every cell needs an entry here, including cells the baseline manuscript
# already printed: the frozen numeric map is keyed on (display_value,
# source_anchor), and the source_anchor is the nearest preceding \label. Renaming
# the table renames the anchor, so a value that resolved at
# tab:path_anchor_summary resolves at NOTHING under the new labels. Rather than
# keep the old label to keep the index happy, each cell is re-derived here from
# its frozen artifact and C01 re-executes all seven steps against it. The
# rebuilt tab:path_anchor_complementary keeps its label, so its surviving cells
# still resolve through the frozen map; the entries below are recorded anyway,
# because the cell-C row and every COV cell are new to that table and because a
# table whose provenance is half in one index and half in another is the kind of
# split a later reader cannot audit.
#
# Two things the entries make visible that the frozen map did not:
#
#   * COV. The map's COV rows carry raw_unit=percent with an identity transform,
#     so their display_value is 0.4 while the manuscript prints 39.7%. The
#     artifact stores COV as a FRACTION (0.39727575972644413) next to a COD that
#     is already a percent (21.6265818314926) -- exactly the unit mixing
#     SELECTOR_GRAMMAR.md section 3 warns about. That is why every printed COV
#     token was FLAGGED at every anchor in the Tier-B0 audit rather than sourced.
#     Here COV carries times_100 + half_up:1, which reproduces the printed value
#     from the stored one.
#   * Cell C. The reference row is new to all three tables, and it is the only
#     reference from which a rho effect may be attributed.
#
# The A/C role guard applies: reference_cell A never carries PENALTY_ISOLATING,
# and reference_cell C never carries WORKFLOW_BENCHMARK. Positive-rho rows are
# recorded against C, because C is the reference their primary comparison uses.
# --------------------------------------------------------------------------

