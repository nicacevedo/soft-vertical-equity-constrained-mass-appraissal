# =============================================================================
# Expected baseline failures, stage by stage.
#
# The canonical manuscript is intentionally NOT compliant with the FINAL-STATE
# Tier-B checks. Every check therefore fires on the unedited baseline, and the
# validator's criterion is
#
#     UNEXPECTED_VALIDATOR_FAILURES == 0
#
# not "the unrevised manuscript passes every final-state check". A validator
# that passes on the baseline is not validating anything, so no check is
# weakened to make the baseline green.
#
# WHAT THIS FILE IS NOT: a blanket exemption. Each expected failure is declared
# individually, with the stage that resolves it and the reason it exists. That
# is what makes resolution ENFORCEABLE in both directions:
#
#   * once a stage has run, any finding whose entry named that stage is
#     reported UNEXPECTED -- a stage cannot quietly fail to do its job;
#   * an entry that stops matching while its stage is still pending is
#     reported as a STALE expectation -- a failure vanishing early is a change
#     worth seeing, not a silent win;
#   * `expected_count` pins the C02 token counts exactly, so the contractual
#     trajectory 356 -> 218 (B1.1) -> 34 (B2.1) -> 0 (B2.2) is verified rather
#     than merely hoped for. A count that moves is a finding.
#
# The C08 prose keys are the sha256 (first 12 hex) of the NORMALIZED sentence,
# not a line number or an anchor. Both of those are unstable by construction:
# B1.1 deletes labels, so a surviving sentence's nearest-label anchor changes,
# and every line number shifts. A content hash is the edit-stable identity
# SELECTOR_GRAMMAR.md section 4 requires -- a deleted sentence's key disappears,
# and a NEW candidate-region sentence gets a key nothing declares.
#
# Stage assignments are taken from the approved execution plan's own section,
# float and claim assignments. Where the plan does not name a stage for a
# particular passage, the entry is assigned to the stage that rewrites the
# section it lives in, and the residue is reported at the mandatory B1 stop
# rather than acted on early.
#
# Generated once at B1.0 from the measured baseline; the `why` text is authored,
# not derived. Do not regenerate it to make a later stage pass.
# =============================================================================
