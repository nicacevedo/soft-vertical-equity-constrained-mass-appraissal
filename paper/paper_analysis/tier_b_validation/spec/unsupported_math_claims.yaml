# =============================================================================
# Known ACTIVE unsupported numerical claims that live inside MATH MODE.
#
# WHY THIS FILE EXISTS -- a measured blind spot, not a hypothetical one.
#
# The Tier-B0 coverage audit masks mathematical environments before extracting
# numeric tokens (analysis/final_manuscript_evidence/code/b0_tex.py: `self.math`
# spans are excluded in `numeric_tokens`). That is a deliberate and correct
# choice for the audit it was built for -- $\rho$, $n$, subscripts and equation
# constants are not manuscript-facing empirical values -- but it has an exact
# consequence: an unsupported empirical NUMBER written as `$0.08677$` is never
# in the token population at all, so it can neither be SOURCED nor
# FLAGGED_UNSUPPORTED. It is simply invisible.
#
# The contractual token trajectory (356 -> 218 -> 34 -> 0) therefore measures
# the TEXT-MODE population only. Reaching `FLAGGED_UNSUPPORTED = 0` at B2.2 is
# a true statement about that population and NOT a statement that every printed
# number has been resolved. Without this file a reader of the B2 report would
# have no way to tell those two apart -- which is exactly the false zero this
# registry exists to prevent.
#
# WHAT THIS FILE IS NOT. It is not a LaTeX numeric parser, and building one was
# explicitly out of scope at B1.5. It is a narrow, hand-authored, Tier-B-owned
# registry of the math-mode claims that ARE known to be unsupported, each
# identified by content rather than by line number, each carrying the stage that
# must remove or rewrite it. It closes a known hole; it does not claim the hole
# is now impossible.
#
# Absence from this file is therefore NOT evidence that a math-mode number is
# supported. If a later stage finds another one, add it here in the same commit.
#
# IDENTITY IS CONTENT, NEVER A LINE NUMBER. Every line number in the frozen maps
# and in the plan went stale at B1.1 by construction (SELECTOR_GRAMMAR.md 4),
# so a claim is located by:
#   * `identify_by_literals` -- every literal decimal string that must appear in
#     one ACTIVE sentence unit for this to be the registered claim. All of them,
#     because a single value can legitimately recur elsewhere: `0.08685` is also
#     the upper end of the lower-tail grid extension in the design section, and
#     matching on it alone would produce a false positive there.
#   * `drift_cue` -- a distinctive normalized phrase, used ONLY to catch the
#     case where the sentence is still present but has been paraphrased or had
#     one of its values changed. A drift finding is deliberately NOT declared in
#     expected_failures.yaml, so it surfaces as an UNEXPECTED failure: a rewrite
#     of one of these claims must update this registry in the same commit.
#   * `normalized_excerpt_sha256` -- the exact text as registered, so a silent
#     edit is visible even when the literals survive.
#
# HOW A CLAIM IS RETIRED. When the owning stage deletes the claim, or rewrites
# it against a frozen artifact and records that derivation in the Tier-B numeric
# ledger, delete the entry here and its expected_failures.yaml entry in that same
# commit. Do not retire an entry by weakening its matcher.
# =============================================================================
schema_version: 1

# Closed vocabulary for `disposition`.
dispositions:
- DELETE
- REWRITE_WITH_SUPPORTED_EVIDENCE
- DELETE_OR_REWRITE_WITH_SUPPORTED_EVIDENCE

claims:

- claim_id: MATH-001-cv-delta-nl-minima
  status: ACTIVE_UNSUPPORTED
  disposition: DELETE_OR_REWRITE_WITH_SUPPORTED_EVIDENCE
  resolved_by_stage: B2.6
  manuscript_anchor: fig:cv_mechanism_metric_paths
  manuscript_section: "Appendix F, subsection: Chronological Fold Stability"
  identify_by_literals: ["0.08685", "0.08677", "1.677"]
  drift_cue: "reaches an interior minimum"
  normalized_excerpt_sha256: c3995c8d70c495038ebe1eadf8f336257662a9c6cff5ada7e5a1399808ab2d99
  normalized_excerpt: >-
    descriptively, on the frozen tested grid, the retrospectively reconstructed
    cv delta_ nl paths also differ across the two objectives: the direct
    equal-weight cv mean reaches its smallest observed value, 0.08685 , only at
    the upper tested boundary rho=100 , whereas the surrogate cv mean reaches an
    interior minimum of 0.08677 at rho =1.677 .
  what_it_claims: >-
    The reconstructed CV Delta_NL path minima: Direct reaching its smallest
    observed equal-weight CV mean 0.08685 only at the upper tested boundary
    rho=100, and Surrogate reaching an interior minimum 0.08677 at rho ~= 1.677.
  why_unsupported: >-
    Neither value, nor the rho ~= 1.677 location, is in the frozen Tier-B0
    numeric map. The approved Tier-B execution plan lists this claim twice --
    section E.6 ("The descriptive CV Delta_NL minima sentence ... is NOT in the
    numeric map -- treat as unsupported unless it resolves") and section G,
    among the claims that cannot be written from the frozen evidence. It is
    also an instance of the broader frozen finding that Delta_NL and dCor are
    absent from frozen_artifact_reproduction.csv at EVERY positive rho, which
    is why the same two columns are being dropped for positive rho from
    tab:path_anchor_complementary at B2.1.
  plan_authority:
  - "tier-b-merry-cloud.md, section E.6 (old 5.3 merged into new 5.4)"
  - "tier-b-merry-cloud.md, section G (claims that cannot yet be written)"
  why_this_stage: >-
    B2.6 owns this passage. The claim sits in the Appendix-F "Chronological Fold
    Stability" block whose eight candidate-region assets and captions B2.6 swaps
    and strips, and it is the LAST Tier-B2 commit, so the mandatory B2 stop
    cannot be reached with the claim still printing. Assigning it earlier would
    not make it more binding; assigning it later would push an unsupported
    number past the stop it must not survive.
  b1_5_note: >-
    Registered, deliberately NOT deleted, at B1.5. B1.5 is a bounded wording and
    validation-boundary pass; deleting an active Results-adjacent claim is B2
    work, and the plan assigns it there. What B1.5 owes is that B2 cannot leave
    it behind by accident, and that no future FLAGGED_UNSUPPORTED = 0 is read as
    having validated it.

# ---------------------------------------------------------------------------
# Discovered at B2.2 and registered in the same commit, exactly as the header
# above requires: "Absence from this file is therefore NOT evidence that a
# math-mode number is supported. If a later stage finds another one, add it here
# in the same commit."
#
# How they were found. B2.1 had to establish, cell by cell, that
# frozen_artifact_reproduction.csv carries NO Delta_NL and NO dCor column at any
# positive rho -- which is why both were dropped as columns from
# tab:path_anchor_complementary. That made a second question unavoidable: where
# else does the manuscript print a positive-rho Delta_NL or dCor value? A scan
# of ACTIVE math-mode decimal literals against the frozen numeric map, the
# Tier-B ledger and the frozen allowlist found three sites. All three are in
# math mode, so C02 never saw them and the contractual
# UNSUPPORTED_TOKENS = 0 at B2.2 says nothing whatever about them.
#
# All three are the SAME frozen fact as MATH-001, in the out-of-time paths
# rather than the CV paths, and the approved plan names each of them:
# section E.6 for the Delta_NL/ratio-shape prose and the dCor non-monotonicity
# (C-results-011, REWRITE), and section G twice -- "Delta_NL or dCor at ANY
# positive rho: absent from frozen_artifact_reproduction.csv" and "The Surrogate
# dCor non-monotonicity (0.382 -> 0.250 -> 0.267): positive-rho endpoints
# unresolvable".
#
# Not deleted at B2.2, for the same reason MATH-001 was not deleted at B1.5:
# B2.2's authorization is the two baseline tables and the Linear decision, and
# the plan assigns these passages to the section 5.4 rewrite that lands with the
# mechanism figure work. They are scheduled to B2.6, the last Tier-B2 commit, so
# the mandatory B2 stop cannot be reached with any of them still printing.
#
# One value in each of these sentences IS supported and must survive a rewrite:
# the rho=0 endpoints. Cell C Delta_NL is 0.116 held-out and 0.121 in 2025, and
# Cell C dCor is 0.382 held-out and 0.417 in 2025, all from
# zero_control_full.csv. It is only the positive-rho values that resolve from
# nothing.
# ---------------------------------------------------------------------------

- claim_id: MATH-002-direct-positive-rho-delta-nl-band
  status: ACTIVE_UNSUPPORTED
  disposition: DELETE_OR_REWRITE_WITH_SUPPORTED_EVIDENCE
  resolved_by_stage: B2.6
  manuscript_anchor: fig:ratio_shape_path_placeholder
  manuscript_section: "Section 5, subsection: How the Valuation-Ratio Shape Changes Along the Path"
  identify_by_literals: ["0.132", "0.115"]
  drift_cue: "similarly stable, ending at"
  normalized_excerpt_sha256: 96549f75b0c3f634e39d326cb554b7d2f10e8923e04c6ad8730de77ecbb8759c
  normalized_excerpt: >-
    along the direct path, held-out delta_ nl remains near 0.116 - 0.132 over
    the previously reported representative configurations and is 0.115 at
    rho=100 ; the 2025 direct path is similarly stable, ending at 0.119 .
  what_it_claims: >-
    That held-out Delta_NL along the Direct path stays in the band 0.116-0.132
    and is 0.115 at rho=100, with the 2025 path ending at 0.119.
  why_unsupported: >-
    Every positive-rho value in the sentence is a Delta_NL value, and
    frozen_artifact_reproduction.csv -- the only artifact that reproduces the
    two frozen positive-rho anchors -- carries no Delta_NL column at all. The
    lower band endpoint 0.116 is the rho=0 Cell-C value and does resolve; the
    upper endpoint 0.132, the 0.115 at rho=100, and the 2025 endpoint 0.119 do
    not. The phrase "over the previously reported representative
    configurations" is itself a residue of the three legacy display anchors
    whose fitted artifacts are hash-pinned but in no checkout.
  plan_authority:
  - "tier-b-merry-cloud.md, section E.6 (C-results-011 REWRITE; old 5.3 merged into new 5.4)"
  - "tier-b-merry-cloud.md, section G (Delta_NL or dCor at ANY positive rho)"
  why_this_stage: >-
    B2.6 owns the mechanism and ratio-shape figures and their surrounding prose,
    and is the last Tier-B2 commit before the mandatory stop.
  b2_2_note: >-
    Discovered and registered at B2.2 while establishing that Delta_NL and dCor
    have no positive-rho column in the frozen reproduction artifact. Registering
    it is what stops UNSUPPORTED_TOKENS = 0 from being read as "every printed
    number resolves".

