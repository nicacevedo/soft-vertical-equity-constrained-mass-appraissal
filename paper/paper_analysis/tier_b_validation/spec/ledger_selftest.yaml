# =============================================================================
# Ledger self-test entries -- they prove the VERIFIER works, they are not claims.
#
# The real ledger is empty at B1.0, so without these the seven-step verifier
# would pass trivially and prove nothing. Each entry below is a number the
# baseline manuscript already prints and the frozen Tier-B0 numeric map already
# resolves, chosen to exercise the whole value pipeline:
#
#   csv  + identity  + half_up:3    a negative coefficient (-0.147)
#   csv  + identity  + half_up:1    a value already in percent (-26.5)
#   csv  + times_100 + half_up:1    a FRACTION shown as a percent (21.2)
#   csv  + identity  + usd_comma:0  a thousands-separated count (46,888)
#   csv  + identity  + sci:3        exponential display (3.24e-02)
#   json + identity  + int          a scalar through a JSON path (994)
#
# The two units cases are the point: MAPE is a fraction in the artifact and a
# percent in the manuscript, while VEI is already a percent. Both display with
# half_up:1, and only value_transform separates them. A pipeline that folded the
# unit conversion into the rounding rule would multiply one of them twice.
#
# tb_ledger.selftest() also MUTATES the first entry seven ways -- wrong sha256,
# a selector that matches nothing, an edited raw_value, a transform and a
# rounding outside the closed vocabularies, a rendered_value that is not the
# pipeline output, and a value not printed at the declared anchor -- and requires
# every one to be REJECTED. That is what shows each step is load-bearing.
#
# These entries sit at anchors this revision keeps, so they stay valid across
# the pass. If a later stage legitimately stops printing one of them, replace
# the entry rather than relaxing the check.
# =============================================================================
