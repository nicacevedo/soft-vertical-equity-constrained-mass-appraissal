# Storyboard — Preliminaries section
# Project: Reducing Regressivity in ML-based Mass Appraisal
# Scope: 9-slide preliminaries (1 title slide + 8 content slides) ending at
# the LR vs LightGBM baseline tension and the regressivity-plot handoff.
# Numbers follow the current paper when sources disagree.

section: preliminaries
audience: research / analytics / OR / ML (general enough for a mixed audience)
one_sentence_thesis: >
  Stronger ML valuation models improve accuracy but worsen the vertical-equity
  diagnostics assessors actually care about; this preliminaries section builds
  that tension from civic relevance down to the baseline comparison.

layout_set:
  - title_slide            # project title + authors + affiliation
  - headline_stats         # one big-number block + short subtitle
  - flow_diagram           # horizontal step diagram
  - annotated_map          # parcel/grid visual with annotations
  - two_column_compare     # two minimal side-by-side panels
  - facts_box_with_timeline
  - two_panel_diagram      # two small conceptual sketches
  - delta_table            # compact table with direction-of-change arrows
  - figure_with_callouts   # main figure + small interpretation cards

slides:

  - slide_number: 1
    title: "Reducing Regressivity in ML-Based Mass Appraisal"
    purpose: >
      Opening slide with project title and authors. No content claims; just
      identification.
    layout_type: title_slide
    key_visual: >
      Large project title, a one-line subtitle with the paper's full subtitle,
      and an author block below with affiliations.
    on_slide_text:
      - "Reducing Regressivity in ML-Based Mass Appraisal"
      - "A Covariance-Penalty Layer for Assessor Workflows"
      - "Nicolás Acevedo — MIT Operations Research Center"
      - "Haihao Lu — MIT Sloan School of Management"
    source_notes: >
      Title and authors taken verbatim from the current paper's title block
      (Current-Paper-(Tex).txt, \\title and \\author). Preliminaries section
      starts on the next slide.

  - slide_number: 2
    title: "Property taxes fund local services, and assessments set everyone's share"
    purpose: >
      Establish civic relevance: why getting valuations right has
      first-order distributional consequences.
    layout_type: headline_stats
    key_visual: >
      Three stacked headline numbers on the left (~72% / ~47% / ~$500B),
      and on the right a simple icon row: house -> "assessed value" ->
      school / road / bus / safety icons. No table, no map.
    on_slide_text:
      - "~72% of U.S. local tax revenue"
      - "~47% of local own-source general revenue"
      - "~$500B per year"
      - "Valuation errors scale into real tax-burden shifts"
    source_notes: >
      Paper intro, Section 1 (Berry 2021 citation): 72% / 47% / ~$500B/year.
      Paper also cites Amornsiripanitch (2020): low-value owners can face
      effective tax rates up to 50% higher than high-value owners — reserve
      this stat for speaker notes, not on-slide.

  - slide_number: 3
    title: "A tax bill is assessed value, minus exemptions, times a rate"
    purpose: >
      Make the mechanism concrete so the audience sees exactly where the
      assessor's estimate enters the pipeline.
    layout_type: flow_diagram
    key_visual: >
      Horizontal 4-step flow with one example property card moving through:
      (1) Assessor estimates market value -> (2) Exemptions / base
      adjustments -> (3) Local tax rate -> (4) Final tax bill. The
      "Assessor estimate" box is highlighted as the focus of the rest of
      the talk.
    on_slide_text:
      - "Property tax ≈ (Assessed value − Exemptions) × Tax rate"
      - "Assessor's estimate enters at step 1"
    source_notes: >
      Mechanism as described in paper Section 1 and Section 2.1 (CCAO
      operational workflow). Chicago-specific rate figure (roughly 2–2.3%)
      stays in speaker notes only; avoid building the slide around city
      rates. Keep the formula as Unicode, not LaTeX.

  - slide_number: 4
    title: "Only a minority of homes sell in a given year, yet every home must be valued"
    purpose: >
      Define mass appraisal and motivate it as an estimation problem over
      the unsold majority; ground the scale in one concrete fact about
      Cook County.
    layout_type: annotated_map
    key_visual: >
      Stylized grid of parcels (or Cook County-shaped tiled map). A small
      minority of tiles (~5%) highlighted as "sold / observed price"; the
      large majority shown as "unsold / must be estimated." Below the grid,
      a short row of feature tags: size, age, bedrooms, neighborhood,
      location, amenities.
    on_slide_text:
      - "Mass appraisal: estimate many properties at once using common data and standardized methods"
      - "Cook County: ~1.5M residential parcels valued on a triennial cycle"
    source_notes: >
      Title softened from "Most homes never sell" to "Only a minority of
      homes sell" because the paper supports the necessity logic without
      asserting the stronger claim. The 1.5M parcels / triennial cycle
      fact is from paper Section 2.1 and makes the slide operational
      rather than abstract. Mass-appraisal definition: paper Section 1
      (IAAO 2025).

  - slide_number: 5
    title: "Many homes, many features, nonlinear interactions — a natural fit for ML"
    purpose: >
      Justify ML without a generic ML lecture; frame the relevant
      comparison as Linear Regression vs LightGBM, matching the paper.
    layout_type: two_column_compare
    key_visual: >
      Two minimal columns with a single icon each. Left column: "Linear
      Regression" (line icon) — simple, interpretable, limited nonlinear
      structure. Right column: "LightGBM / boosted trees" (tree-ensemble
      icon) — stronger fit on complex tabular data. A small arrow
      underneath labeled "more flexible."
    on_slide_text:
      - "Linear Regression: simple, interpretable, limited nonlinearity"
      - "LightGBM (boosted trees): stronger fit on tabular real-estate data"
      - "Assessor offices have moved in this direction"
    source_notes: >
      Paper Section 1 and related work: CCAO uses a LightGBM-based AVM;
      move from LR to tree ensembles is the operational comparison of
      interest. Do not introduce fairness, proxy-price, or interpretability
      concerns here — those come on slides 7–9.

  - slide_number: 6
    title: "Cook County gives us a realistic assessor workflow to study"
    purpose: >
      Ground the rest of the talk in one concrete assessor pipeline with
      a realistic temporal split. Separate the pre-2024 modeling sample
      from the 2024 assessment year.
    layout_type: facts_box_with_timeline
    key_visual: >
      Left: small Cook County / Chicago locator map. Right: horizontal
      timeline strip showing three blocks — "2016–2022 train + 8-fold
      rolling validation," "2023 held-out test," "2024 assessment." A
      compact facts box under the map lists the four headline numbers.
    on_slide_text:
      - "349,661 verified sales in the pre-2024 modeling sample"
      - "95 predictors"
      - "Train/validate: 2016–2022 | Test: 2023 | Assessment: 2024"
      - "Translated CCAO 2025-cycle residential pipeline (open code)"
    source_notes: >
      Title no longer fuses the 349,661 count with the 2016–2024 timeline.
      Paper Section 5: 349,661 verified residential sales in the
      modeling-ready sample (multicard PINs and office-flagged outliers
      excluded). Temporal structure in Table tab:data_splits:
      train/validate 2016–2022 with 8 rolling-origin expanding-window
      folds, test 2023, assessment year 2024. Do not use the beamer's
      rough ">350K / ~200 raw features" wording.

  - slide_number: 7
    title: "Assessors care about fairness both within tiers and across tiers"
    purpose: >
      Introduce horizontal vs vertical equity and the assessment ratio in
      assessor-facing language; set up regressivity. Metric formulas
      belong on later slides, not here.
    layout_type: two_panel_diagram
    key_visual: >
      Two conceptual sketch panels side-by-side, drawn in code (not
      described). Left panel — horizontal equity: three similar houses
      with ratios shown as badges; first group dispersed, second group
      tight. Right panel — vertical equity: a row of houses scaled
      low-to-high with ratio badges that step downward from >1 to <1,
      indicating a regressive pattern. Below both panels, a single line
      with the assessment-ratio definition in Unicode.
    on_slide_text:
      - "Horizontal equity: similar homes should receive similar ratios"
      - "Vertical equity: ratios should not systematically fall with value"
      - "Assessment ratio: r = P̂ / P"
    source_notes: >
      Paper Section 2 (Preliminaries): horizontal equity tracked by COD;
      vertical equity tracked by PRD, PRB, VEI. Keep this slide
      metric-light — full PRD/PRB/VEI formulas appear later or in the
      appendix. Ratio notation is the clean paper form r = P̂ / P (not
      AV/MV). This slide must be drawn as real shapes, not placeholder
      text describing the visual.

  - slide_number: 8
    title: "LightGBM beats linear regression on accuracy but worsens vertical equity"
    purpose: >
      State the baseline tension the rest of the paper is designed to
      resolve. This is the hinge slide of the preliminaries and must
      visually scream "accuracy up, vertical equity down."
    layout_type: delta_table
    key_visual: >
      Compact 2-row table (Linear Regression vs LightGBM) on the 2023
      CCAO test set. Columns: R², MAE, COD, PRD, PRB, VEI. Green
      highlighting where LightGBM improves (R², MAE, COD); red
      highlighting where it degrades (PRD, PRB, VEI). Short subtitle
      strip under the title: "Stronger fit, worse vertical equity."
    on_slide_text:
      - "2023 CCAO test set"
      - "Linear Regression: R² 0.762 | MAE $86,257 | PRD 1.039 | PRB −0.011 | VEI −13.5%"
      - "LightGBM: R² 0.883 | MAE $72,064 | PRD 1.085 | PRB −0.118 | VEI −36.8%"
      - "Stronger fit, worse vertical equity"
    source_notes: >
      All numbers from paper Section 5, Table tab:baseline_models
      (baseline comparison on the 2023 test set). Do not substitute the
      current beamer's older snapshot (e.g., R² 0.798 vs 0.860, or R²
      0.887 with MAE $71,337) — paper wins. IAAO compliance reference
      points (speaker notes): PRD > 1.03, PRB < −0.05, VEI < −10%
      indicate regressivity; LightGBM's PRD/PRB/VEI all cross those
      thresholds while LR sits inside or near them.

  - slide_number: 9
    title: "The baseline model shifts tax burden across value tiers"
    purpose: >
      Land the regressivity intuition with the real ratio-vs-log-price
      plot and a brief two-tier financial interpretation; set up the
      method section.
    layout_type: figure_with_callouts
    key_visual: >
      Main panel (~70% of slide): baseline LightGBM ratio-vs-log-price
      figure — load from assets/figures if available, otherwise render
      a native scatter + trend line with schematic but representative
      data. A horizontal r=1 reference line and a LOWESS-style trend
      with regions above/below labeled "over-assessed" and
      "under-assessed." Right panel (~30%): two house cards — low-value
      home with "r > 1: taxed as if worth too much," high-value home
      with "r < 1: taxed as if worth too little." Small notation box:
      r = P̂ / P.
    on_slide_text:
      - "Lower-value homes tend to be over-assessed"
      - "Higher-value homes tend to be under-assessed"
      - "x-axis is log-price because prices are highly right-skewed"
    source_notes: >
      Figure corresponds to paper Figure fig:regressivity_motivation
      (baseline LightGBM, 2023 CCAO test, ratio r = P̂ / P vs log-price).
      The paper uses log-price because sale prices are highly
      right-skewed, so log-scale makes the trend comparable across value
      levels — that is the justification for the x-axis explainer.
      Preferred: assets/figures/baseline_regressivity_plot.png if
      present. Fallback: synthetic-data scatter rendered by the
      generator (labeled as schematic in speaker notes). Keep framing
      to two tiers; avoid a dense 5-quantile breakdown here.
